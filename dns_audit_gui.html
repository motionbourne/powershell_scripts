<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://dns.google https://cloudflare-dns.com https://rdap.org; img-src 'self' data:;">
<title>DNS Audit Tool</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2235;
    --border: #1e2d45;
    --accent: #00d4ff;
    --accent2: #7c3aed;
    --green: #10b981;
    --red: #ef4444;
    --yellow: #f59e0b;
    --blue: #3b82f6;
    --text: #e2e8f0;
    --muted: #64748b;
    --font-mono: 'JetBrains Mono', monospace;
    --font-display: 'Syne', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-display);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .glow-orb {
    position: fixed;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.12;
    pointer-events: none;
    z-index: 0;
  }
  .glow-orb-1 { background: var(--accent); top: -200px; right: -100px; }
  .glow-orb-2 { background: var(--accent2); bottom: -200px; left: -100px; }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 24px;
    position: relative;
    z-index: 1;
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 48px;
    animation: fadeDown 0.6s ease both;
  }

  .logo {
    width: 48px;
    height: 48px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }

  header h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }

  header span {
    display: block;
    font-size: 13px;
    color: var(--muted);
    font-weight: 400;
    font-family: var(--font-mono);
    margin-top: 2px;
  }

  .search-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    margin-bottom: 32px;
    animation: fadeUp 0.6s ease 0.1s both;
  }

  .search-label {
    font-size: 12px;
    font-family: var(--font-mono);
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 12px;
  }

  .search-row { display: flex; gap: 12px; }

  .search-input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 20px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 16px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,212,255,0.1);
  }

  .search-input::placeholder { color: var(--muted); }

  .btn-audit {
    background: linear-gradient(135deg, var(--accent), #0099cc);
    border: none;
    border-radius: 10px;
    padding: 14px 28px;
    color: #000;
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    white-space: nowrap;
  }

  .btn-audit:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(0,212,255,0.3); }
  .btn-audit:active { transform: translateY(0); }
  .btn-audit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .progress-bar-wrap {
    height: 3px;
    background: var(--border);
    border-radius: 99px;
    margin-top: 20px;
    overflow: hidden;
    display: none;
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
    width: 0%;
    transition: width 0.3s ease;
  }

  .progress-label {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    margin-top: 10px;
    display: none;
  }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 16px;
    margin-bottom: 32px;
    animation: fadeUp 0.6s ease 0.2s both;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    transition: border-color 0.3s;
  }

  .stat-card.found { border-color: rgba(16,185,129,0.3); }
  .stat-card.notfound { border-color: rgba(239,68,68,0.3); }
  .stat-card.error { border-color: rgba(245,158,11,0.3); }
  .stat-card.info { border-color: rgba(59,130,246,0.3); }
  .stat-card.total { border-color: rgba(0,212,255,0.3); }

  .stat-number {
    font-size: 32px;
    font-weight: 800;
    font-family: var(--font-mono);
    line-height: 1;
    margin-bottom: 6px;
  }

  .stat-card.found .stat-number { color: var(--green); }
  .stat-card.notfound .stat-number { color: var(--red); }
  .stat-card.error .stat-number { color: var(--yellow); }
  .stat-card.info .stat-number { color: var(--blue); }
  .stat-card.total .stat-number { color: var(--accent); }

  .stat-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-family: var(--font-mono);
  }

  .results-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    animation: fadeUp 0.6s ease 0.3s both;
  }

  .results-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    flex-wrap: gap;
    gap: 12px;
  }

  .results-title {
    font-size: 14px;
    font-family: var(--font-mono);
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .filter-row { display: flex; gap: 8px; flex-wrap: wrap; }

  .filter-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 14px;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 700; }
  .filter-btn.active-green { background: var(--green); border-color: var(--green); color: #000; font-weight: 700; }
  .filter-btn.active-red { background: var(--red); border-color: var(--red); color: #fff; font-weight: 700; }

  .results-table { width: 100%; border-collapse: collapse; }

  .results-table th {
    text-align: left;
    padding: 12px 24px;
    font-size: 10px;
    font-family: var(--font-mono);
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }

  .results-table td {
    padding: 14px 24px;
    font-size: 13px;
    border-bottom: 1px solid rgba(30,45,69,0.5);
    vertical-align: top;
  }

  .results-table tr:last-child td { border-bottom: none; }
  .results-table tr:hover td { background: rgba(255,255,255,0.02); }

  .section-name { font-weight: 600; color: var(--text); font-size: 13px; }
  .record-type { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-top: 3px; }
  .hostname { font-family: var(--font-mono); font-size: 12px; color: var(--muted); word-break: break-all; }
  .value { font-family: var(--font-mono); font-size: 12px; color: var(--text); word-break: break-all; max-width: 340px; }

  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 99px;
    font-size: 10px;
    font-family: var(--font-mono);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    white-space: nowrap;
  }

  .badge-found { background: rgba(16,185,129,0.15); color: var(--green); border: 1px solid rgba(16,185,129,0.3); }
  .badge-notfound { background: rgba(239,68,68,0.15); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
  .badge-error { background: rgba(245,158,11,0.15); color: var(--yellow); border: 1px solid rgba(245,158,11,0.3); }
  .badge-info { background: rgba(59,130,246,0.15); color: var(--blue); border: 1px solid rgba(59,130,246,0.3); }
  .badge-checking { background: rgba(245,158,11,0.15); color: var(--yellow); border: 1px solid rgba(245,158,11,0.3); }

  .export-row {
    display: flex;
    gap: 10px;
    padding: 20px 24px;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }

  .btn-export {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 20px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-export:hover { border-color: var(--accent); color: var(--accent); }

  .empty-state { text-align: center; padding: 80px 24px; color: var(--muted); }
  .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
  .empty-state h3 { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: var(--text); opacity: 0.5; }
  .empty-state p { font-size: 13px; font-family: var(--font-mono); }

  .provider-banner {
    background: linear-gradient(135deg, rgba(0,212,255,0.08), rgba(124,58,237,0.08));
    border: 1px solid rgba(0,212,255,0.2);
    border-radius: 10px;
    padding: 14px 20px;
    margin-top: 20px;
    font-family: var(--font-mono);
    font-size: 13px;
    display: none;
    animation: fadeUp 0.4s ease both;
  }

  .provider-banner strong { color: var(--accent); }

  .failure-banner {
    background: rgba(245,158,11,0.12);
    border: 1px solid rgba(245,158,11,0.45);
    border-radius: 10px;
    padding: 14px 20px;
    margin-bottom: 24px;
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--yellow);
    display: none;
    animation: fadeUp 0.4s ease both;
  }

  .failure-banner strong { color: #fbbf24; }

  .input-error {
    margin-top: 12px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--red);
    display: none;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(0,0,0,0.3);
    border-top-color: #000;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }

  .result-row { animation: fadeUp 0.3s ease both; }

  @media (max-width: 768px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .search-row { flex-direction: column; }
    .results-header { flex-direction: column; align-items: flex-start; }
    .results-table th:nth-child(3), .results-table td:nth-child(3) { display: none; }
  }
</style>
</head>
<body>

<div class="glow-orb glow-orb-1"></div>
<div class="glow-orb glow-orb-2"></div>

<div class="container">

  <header>
    <div class="logo">⬡</div>
    <div>
      <h1>DNS Audit Tool</h1>
      <span>Comprehensive domain record analysis</span>
    </div>
  </header>

  <div class="search-card">
    <div class="search-label">Target Domain</div>
    <div class="search-row">
      <input class="search-input" id="domainInput" type="text" placeholder="e.g. example.com" autocomplete="off" spellcheck="false" />
      <button class="btn-audit" id="auditBtn" onclick="runAudit()">
        <span id="btnText">Run Audit</span>
      </button>
    </div>
    <div class="progress-bar-wrap" id="progressWrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="progress-label" id="progressLabel"></div>
    <div class="input-error" id="inputError"></div>
    <div class="provider-banner" id="providerBanner"></div>
  </div>

  <div class="failure-banner" id="failureBanner"></div>

  <div class="stats-row">
    <div class="stat-card total">
      <div class="stat-number" id="statTotal">—</div>
      <div class="stat-label">Total Checks</div>
    </div>
    <div class="stat-card found">
      <div class="stat-number" id="statFound">—</div>
      <div class="stat-label">Found</div>
    </div>
    <div class="stat-card notfound">
      <div class="stat-number" id="statNotFound">—</div>
      <div class="stat-label">Not Found</div>
    </div>
    <div class="stat-card error">
      <div class="stat-number" id="statErrors">—</div>
      <div class="stat-label">Lookup Failed</div>
    </div>
    <div class="stat-card info">
      <div class="stat-number" id="statInfo">—</div>
      <div class="stat-label">Info</div>
    </div>
  </div>

  <div class="results-card">
    <div class="results-header">
      <div class="results-title">Results</div>
      <div class="filter-row">
        <button class="filter-btn active" id="filterAll" onclick="setFilter('all')">All</button>
        <button class="filter-btn" id="filterFound" onclick="setFilter('found')">Found</button>
        <button class="filter-btn" id="filterNotFound" onclick="setFilter('notfound')">Not Found</button>
      </div>
    </div>

    <div id="tableWrap">
      <div class="empty-state">
        <div class="empty-icon">◈</div>
        <h3>No audit run yet</h3>
        <p>Enter a domain above and click Run Audit</p>
      </div>
    </div>

    <div class="export-row" id="exportRow" style="display:none">
      <button class="btn-export" onclick="exportCSV()">⬇ Export CSV</button>
      <button class="btn-export" onclick="exportTXT()">⬇ Export TXT</button>
    </div>
  </div>

</div>

<script>
const RESOLVERS = [
  { id: 'google', url: 'https://dns.google/resolve', label: 'Google Public DNS (DoH)' },
  { id: 'cloudflare', url: 'https://cloudflare-dns.com/dns-query', label: 'Cloudflare DNS (DoH)' }
];
const DNS_TIMEOUT_MS = 5000;
const QUERY_CONCURRENCY = 6;
const MASS_FAILURE_RATE = 0.3;
const MASS_FAILURE_HEAD = 5;

let allResults = [];
let currentFilter = 'all';
let auditDomain = '';
let auditMeta = { startedAt: null, resolversUsed: new Set() };

function esc(s) {
  return s == null ? '' : String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

const checks = [
  { section: 'Main Domain - A Record',                 type: 'A',     host: d => d },
  { section: 'Main Domain - AAAA (IPv6)',               type: 'AAAA',  host: d => d },
  { section: 'Main Domain - MX (Mail)',                 type: 'MX',    host: d => d },
  { section: 'Main Domain - TXT (SPF etc)',             type: 'TXT',   host: d => d },
  { section: 'Main Domain - NS (Nameservers)',          type: 'NS',    host: d => d },
  { section: 'Main Domain - SOA',                       type: 'SOA',   host: d => d },
  { section: 'Main Domain - CAA (SSL Certificate)',     type: 'CAA',   host: d => d },
  { section: 'WWW Record',                              type: 'CNAME', host: d => `www.${d}` },

  { section: 'VPN Record',                              type: 'A',     host: d => `vpn.${d}` },
  { section: 'Mail Record',                             type: 'A',     host: d => `mail.${d}` },
  { section: 'SMTP Record',                             type: 'A',     host: d => `smtp.${d}` },
  { section: 'IMAP Record',                             type: 'A',     host: d => `imap.${d}` },
  { section: 'POP Record',                              type: 'A',     host: d => `pop.${d}` },
  { section: 'DMARC',                                   type: 'TXT',   host: d => `_dmarc.${d}` },
  { section: 'DKIM - General',                          type: 'TXT',   host: d => `_domainkey.${d}` },
  { section: 'DKIM - Mailchimp (k1)',                   type: 'CNAME', host: d => `k1._domainkey.${d}` },
  { section: 'DKIM - Mailchimp (k2)',                   type: 'CNAME', host: d => `k2._domainkey.${d}` },
  { section: 'DKIM - Mailchimp (k3)',                   type: 'CNAME', host: d => `k3._domainkey.${d}` },
  { section: 'DKIM - Mailchimp (k4)',                   type: 'CNAME', host: d => `k4._domainkey.${d}` },
  { section: 'DKIM - Mailchimp (k5)',                   type: 'CNAME', host: d => `k5._domainkey.${d}` },
  { section: 'DKIM - Mailchimp Mandrill',               type: 'CNAME', host: d => `mandrill._domainkey.${d}` },
  { section: 'DKIM - SendGrid (s1)',                    type: 'CNAME', host: d => `s1._domainkey.${d}` },
  { section: 'DKIM - SendGrid (s2)',                    type: 'CNAME', host: d => `s2._domainkey.${d}` },
  { section: 'DKIM - SendGrid (em)',                    type: 'CNAME', host: d => `em._domainkey.${d}` },

  { section: 'DKIM - HubSpot (hs1)',                    type: 'CNAME', host: d => `hs1._domainkey.${d}` },
  { section: 'DKIM - HubSpot (hs2)',                    type: 'CNAME', host: d => `hs2._domainkey.${d}` },
  { section: 'DKIM - Zoho',                             type: 'TXT',   host: d => `zoho._domainkey.${d}` },

  { section: 'DKIM - Klaviyo',                          type: 'CNAME', host: d => `klaviyo._domainkey.${d}` },

  { section: 'DKIM - Microsoft Selector2',              type: 'CNAME', host: d => `selector2._domainkey.${d}` },
  { section: 'DKIM - Google Workspace',                 type: 'TXT',   host: d => `google._domainkey.${d}` },
  { section: 'MTA-STS',                                 type: 'TXT',   host: d => `_mta-sts.${d}` },
  { section: 'TLS Reporting',                           type: 'TXT',   host: d => `_smtp._tls.${d}` },
  { section: 'Autodiscover (Microsoft 365)',            type: 'CNAME', host: d => `autodiscover.${d}` },
  { section: 'Microsoft Online ID',                     type: 'CNAME', host: d => `msoid.${d}` },
  { section: 'Enterprise Registration (M365)',          type: 'CNAME', host: d => `enterpriseregistration.${d}` },
  { section: 'Enterprise Enrollment (MDM)',             type: 'CNAME', host: d => `enterpriseenrollment.${d}` },
  { section: 'Lync Discover (Teams/SfB)',               type: 'CNAME', host: d => `lyncdiscover.${d}` },
  { section: 'SIP Record (Teams Voice)',                type: 'CNAME', host: d => `sip.${d}` },
  { section: 'SIP TLS (Teams Voice)',                   type: 'SRV',   host: d => `_sip._tls.${d}` },
  { section: 'SIP Federation (Teams)',                  type: 'SRV',   host: d => `_sipfederationtls._tcp.${d}` },
];

function normalizeDomainInput(raw) {
  let s = String(raw || '').trim().toLowerCase();
  if (!s) return '';
  if (s.includes('@')) s = s.split('@').pop();
  s = s.replace(/^mailto:/, '');
  s = s.replace(/^https?:\/\//, '').replace(/^\/\//, '');
  s = s.split('/')[0].split('?')[0].split('#')[0];
  if (s.includes(':') && !s.startsWith('[')) s = s.split(':')[0];
  s = s.replace(/^\.+|\.+$/g, '');
  return s;
}

function validateDomain(domain) {
  if (!domain) return { ok: false, message: 'Enter a domain name (e.g. example.com).' };
  if (domain.length > 253) return { ok: false, message: 'Domain name is too long.' };
  const labels = domain.split('.');
  if (labels.length < 2) {
    return { ok: false, message: 'Enter a fully-qualified domain (e.g. example.com), not a single label.' };
  }
  const labelRe = /^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$/;
  for (const label of labels) {
    if (!label || !labelRe.test(label)) {
      return { ok: false, message: `Invalid domain: "${domain}". Check for typos, URLs, or email addresses.` };
    }
  }
  return { ok: true, domain };
}

function showInputError(message) {
  const el = document.getElementById('inputError');
  if (!message) {
    el.style.display = 'none';
    el.textContent = '';
    return;
  }
  el.style.display = 'block';
  el.textContent = message;
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function fetchWithTimeout(url, options = {}, timeoutMs = DNS_TIMEOUT_MS) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    return await fetch(url, { ...options, signal: controller.signal });
  } finally {
    clearTimeout(timer);
  }
}

function normalizeTxtData(data) {
  if (data == null) return '';
  let s = String(data).trim();
  const parts = [];
  while (s.length) {
    if (s.startsWith('"')) {
      const end = s.indexOf('"', 1);
      if (end === -1) {
        parts.push(s.replace(/^"|"$/g, ''));
        break;
      }
      parts.push(s.slice(1, end));
      s = s.slice(end + 1).trim();
      continue;
    }
    parts.push(s);
    break;
  }
  return parts.join('');
}

function normalizeDnsAnswer(answers, type) {
  if (!answers || !answers.length) return null;
  if (type === 'TXT') {
    return answers.map(a => normalizeTxtData(a.data)).join('\n');
  }
  return answers.map(a => a.data).join('\n');
}

function parseDnsPayload(data, type, resolverId) {
  const rcode = typeof data.Status === 'number' ? data.Status : null;
  if (rcode === 0) {
    const value = normalizeDnsAnswer(data.Answer, type);
    if (value) {
      return { status: 'found', value, rcode, resolver: resolverId };
    }
    return { status: 'absent', value: null, rcode, resolver: resolverId };
  }
  if (rcode === 3) {
    return { status: 'absent', value: null, rcode, resolver: resolverId };
  }
  return {
    status: 'error',
    value: null,
    rcode,
    resolver: resolverId,
    message: rcode == null ? 'Invalid DNS response' : `DNS rcode ${rcode}`
  };
}

function isTransientHttp(status) {
  return status === 429 || status >= 500;
}

async function queryDNSOnce(hostname, type, resolver) {
  const url = `${resolver.url}?name=${encodeURIComponent(hostname)}&type=${encodeURIComponent(type)}`;
  const headers = resolver.id === 'cloudflare' ? { Accept: 'application/dns-json' } : {};
  const res = await fetchWithTimeout(url, { headers });

  if (res.status === 429) {
    await sleep(1000 + Math.floor(Math.random() * 500));
    throw new Error('HTTP 429 rate limited');
  }
  if (!res.ok) {
    throw new Error(`HTTP ${res.status}`);
  }

  let data;
  try {
    data = await res.json();
  } catch (e) {
    throw new Error('Invalid JSON from resolver');
  }

  return parseDnsPayload(data, type, resolver.id);
}

async function queryDNS(hostname, type) {
  let lastError = null;

  for (let r = 0; r < RESOLVERS.length; r++) {
    const resolver = RESOLVERS[r];
    for (let attempt = 0; attempt < 2; attempt++) {
      try {
        const result = await queryDNSOnce(hostname, type, resolver);
        if (result.status !== 'error') {
          auditMeta.resolversUsed.add(resolver.id);
          return result;
        }
        lastError = result;
        break;
      } catch (e) {
        lastError = {
          status: 'error',
          value: null,
          rcode: null,
          resolver: resolver.id,
          message: e.name === 'AbortError' ? 'Lookup timed out' : (e.message || String(e))
        };
        if (attempt === 0) continue;
        break;
      }
    }
  }

  return lastError || {
    status: 'error',
    value: null,
    rcode: null,
    resolver: null,
    message: 'All resolvers failed'
  };
}

function dnsResultToRow(check, hostname, result) {
  if (result.status === 'found') {
    return {
      section: check.section,
      type: check.type,
      hostname,
      value: result.value,
      status: 'FOUND',
      resolver: result.resolver,
      rcode: result.rcode
    };
  }
  if (result.status === 'absent') {
    return {
      section: check.section,
      type: check.type,
      hostname,
      value: 'Not Found',
      status: 'NOT FOUND',
      resolver: result.resolver,
      rcode: result.rcode
    };
  }
  return {
    section: check.section,
    type: check.type,
    hostname,
    value: result.message || 'Lookup failed',
    status: 'LOOKUP FAILED',
    resolver: result.resolver,
    rcode: result.rcode
  };
}

function vcardField(vcard, names) {
  if (!Array.isArray(vcard) || vcard.length < 2 || !Array.isArray(vcard[1])) return null;
  for (const row of vcard[1]) {
    if (!Array.isArray(row) || row.length < 4) continue;
    if (names.includes(row[0]) && row[3]) return String(row[3]);
  }
  return null;
}

async function getProvider(domain) {
  const nsResult = await queryDNS(domain, 'NS');
  if (nsResult.status !== 'found' || !nsResult.value) return null;

  const firstNS = nsResult.value.split('\n')[0].toLowerCase().replace(/\.$/, '');
  const parts = firstNS.split('.');
  const root = parts.length >= 2 ? `${parts[parts.length - 2]}.${parts[parts.length - 1]}` : firstNS;

  let provider = 'Unknown';
  try {
    const rdap = await fetchWithTimeout(`https://rdap.org/domain/${encodeURIComponent(root)}`);
    if (rdap.ok) {
      const data = await rdap.json();
      if (Array.isArray(data.entities)) {
        for (const entity of data.entities) {
          if (!entity || typeof entity !== 'object') continue;
          const fromVcard = vcardField(entity.vcardArray, ['fn', 'org']);
          if (fromVcard) {
            provider = fromVcard;
            break;
          }
        }
      }
    }
  } catch (e) {
    // RDAP failure is non-fatal; nameservers still useful.
  }

  return {
    provider,
    root,
    nameservers: nsResult.value.split('\n').join(', '),
    resolver: nsResult.resolver
  };
}

async function mapPool(items, limit, worker) {
  const results = new Array(items.length);
  let nextIndex = 0;

  async function runWorker() {
    while (true) {
      const i = nextIndex++;
      if (i >= items.length) break;
      results[i] = await worker(items[i], i);
    }
  }

  const workers = Array.from({ length: Math.min(limit, items.length) }, () => runWorker());
  await Promise.all(workers);
  return results;
}

function updateMassFailureBanner() {
  const banner = document.getElementById('failureBanner');
  const checkRows = allResults.filter(r => r.status !== 'INFO');
  const errors = checkRows.filter(r => r.status === 'LOOKUP FAILED').length;
  const total = checkRows.length;
  const head = checkRows.slice(0, MASS_FAILURE_HEAD);
  const allHeadFailed = head.length >= MASS_FAILURE_HEAD && head.every(r => r.status === 'LOOKUP FAILED');
  const highErrorRate = total > 0 && (errors / total) >= MASS_FAILURE_RATE;

  if (allHeadFailed || highErrorRate) {
    banner.style.display = 'block';
    banner.innerHTML = '<strong>DNS lookups are failing</strong> — check connectivity, or that this network allows DNS-over-HTTPS to dns.google / cloudflare-dns.com. ' +
      'Do not treat <em>Lookup Failed</em> rows as proof a record is absent.';
    return;
  }
  banner.style.display = 'none';
  banner.innerHTML = '';
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => { b.className = 'filter-btn'; });
  if (f === 'all') document.getElementById('filterAll').className = 'filter-btn active';
  if (f === 'found') document.getElementById('filterFound').className = 'filter-btn active-green';
  if (f === 'notfound') document.getElementById('filterNotFound').className = 'filter-btn active-red';
  renderTable();
}

function renderTable() {
  const filtered = allResults.filter(r => {
    if (currentFilter === 'all') return true;
    if (currentFilter === 'found') return r.status === 'FOUND' || r.status === 'INFO';
    if (currentFilter === 'notfound') return r.status === 'NOT FOUND';
    return true;
  });

  if (filtered.length === 0 && allResults.length === 0) {
    document.getElementById('tableWrap').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">◈</div>
        <h3>No audit run yet</h3>
        <p>Enter a domain above and click Run Audit</p>
      </div>`;
    return;
  }

  let html = `<table class="results-table">
    <thead><tr>
      <th>Section</th>
      <th>Type</th>
      <th>Hostname</th>
      <th>Value</th>
      <th>Status</th>
    </tr></thead><tbody>`;

  filtered.forEach((r, i) => {
    const badge = r.status === 'FOUND' ? 'badge-found' :
                  r.status === 'NOT FOUND' ? 'badge-notfound' :
                  r.status === 'LOOKUP FAILED' ? 'badge-error' : 'badge-info';
    const valueDisplay = r.value && r.value !== 'Not Found'
      ? esc(r.value).replace(/\n/g, '<br>')
      : '<span style="color:var(--muted)">—</span>';
    html += `<tr class="result-row" style="animation-delay:${i * 0.02}s">
      <td><div class="section-name">${esc(r.section)}</div><div class="record-type">${esc(r.type)}</div></td>
      <td><span class="badge badge-info">${esc(r.type)}</span></td>
      <td><div class="hostname">${esc(r.hostname)}</div></td>
      <td><div class="value">${valueDisplay}</div></td>
      <td><span class="badge ${badge}">${esc(r.status)}</span></td>
    </tr>`;
  });

  html += '</tbody></table>';
  document.getElementById('tableWrap').innerHTML = html;
}

function updateStats() {
  const found = allResults.filter(r => r.status === 'FOUND').length;
  const notFound = allResults.filter(r => r.status === 'NOT FOUND').length;
  const errors = allResults.filter(r => r.status === 'LOOKUP FAILED').length;
  const info = allResults.filter(r => r.status === 'INFO').length;
  document.getElementById('statTotal').textContent = allResults.length;
  document.getElementById('statFound').textContent = found;
  document.getElementById('statNotFound').textContent = notFound;
  document.getElementById('statErrors').textContent = errors;
  document.getElementById('statInfo').textContent = info;
}

function resolverExportLabel() {
  const used = [...auditMeta.resolversUsed];
  if (!used.length) return 'none';
  return used.map(id => {
    const r = RESOLVERS.find(x => x.id === id);
    return r ? r.label : id;
  }).join('; ');
}

async function runAudit() {
  showInputError('');
  const normalized = normalizeDomainInput(document.getElementById('domainInput').value);
  const validation = validateDomain(normalized);
  if (!validation.ok) {
    showInputError(validation.message);
    return;
  }

  const domain = validation.domain;
  document.getElementById('domainInput').value = domain;

  auditDomain = domain;
  allResults = [];
  currentFilter = 'all';
  auditMeta = { startedAt: new Date().toISOString(), resolversUsed: new Set() };

  const btn = document.getElementById('auditBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Auditing...';

  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('progressLabel').style.display = 'block';
  document.getElementById('providerBanner').style.display = 'none';
  document.getElementById('failureBanner').style.display = 'none';
  document.getElementById('exportRow').style.display = 'none';

  document.querySelectorAll('.filter-btn').forEach(b => b.className = 'filter-btn');
  document.getElementById('filterAll').className = 'filter-btn active';

  document.getElementById('statTotal').textContent = '—';
  document.getElementById('statFound').textContent = '—';
  document.getElementById('statNotFound').textContent = '—';
  document.getElementById('statErrors').textContent = '—';
  document.getElementById('statInfo').textContent = '—';

  document.getElementById('tableWrap').innerHTML = `
    <div class="empty-state">
      <div class="empty-icon" style="animation: spin 1s linear infinite; display:inline-block">◈</div>
      <h3 style="opacity:1">Auditing ${esc(domain)}...</h3>
      <p>Checking DNS records via DoH (Google, Cloudflare fallback)</p>
    </div>`;

  document.getElementById('progressLabel').textContent = 'Detecting DNS provider...';
  const providerData = await getProvider(domain);
  if (providerData) {
    document.getElementById('providerBanner').style.display = 'block';
    document.getElementById('providerBanner').innerHTML =
      `DNS Provider: <strong>${esc(providerData.provider)}</strong> &nbsp;|&nbsp; Root: <strong>${esc(providerData.root)}</strong> &nbsp;|&nbsp; Nameservers: ${esc(providerData.nameservers)}`;
    allResults.push({
      section: 'DNS Provider',
      type: 'NS',
      hostname: providerData.root,
      value: providerData.nameservers,
      status: 'INFO',
      resolver: providerData.resolver
    });
    updateStats();
    renderTable();
  }

  let completed = 0;
  const checkResults = await mapPool(checks, QUERY_CONCURRENCY, async (check) => {
    const hostname = check.host(domain);
    const result = await queryDNS(hostname, check.type);
    const row = dnsResultToRow(check, hostname, result);

    completed++;
    document.getElementById('progressLabel').textContent = `Checking: ${check.section}`;
    document.getElementById('progressBar').style.width = `${(completed / checks.length) * 100}%`;

    return row;
  });

  allResults.push(...checkResults);
  updateStats();
  updateMassFailureBanner();
  renderTable();

  document.getElementById('progressLabel').textContent = 'Audit complete!';
  document.getElementById('exportRow').style.display = 'flex';

  btn.disabled = false;
  btn.innerHTML = 'Run Audit';
}

function exportCSV() {
  let csv = 'Section,Type,Hostname,Value,Status,Resolver\n';
  allResults.forEach(r => {
    const val = (r.value || '').replace(/\n/g, ' ').replace(/"/g, '""');
    csv += `"${r.section}","${r.type}","${r.hostname}","${val}","${r.status}","${r.resolver || ''}"\n`;
  });
  const stamp = auditMeta.startedAt || new Date().toISOString();
  csv += `"","","","Resolvers: ${resolverExportLabel()} | Audit UTC: ${stamp}","",""\n`;
  download(`DNS_Audit_${auditDomain}_${stamp.slice(0, 10)}.csv`, csv, 'text/csv');
}

function exportTXT() {
  const stamp = auditMeta.startedAt || new Date().toISOString();
  let txt = `DNS AUDIT REPORT\n`;
  txt += `Domain    : ${auditDomain}\n`;
  txt += `Audit UTC : ${stamp}\n`;
  txt += `Resolvers : ${resolverExportLabel()}\n`;
  txt += `${'='.repeat(60)}\n\n`;
  allResults.forEach(r => {
    txt += `${r.section} [${r.type}]\n`;
    txt += `Hostname : ${r.hostname}\n`;
    txt += `Value    : ${r.value}\n`;
    txt += `Status   : ${r.status}\n`;
    if (r.resolver) txt += `Resolver : ${r.resolver}\n`;
    txt += `${'-'.repeat(40)}\n`;
  });
  download(`DNS_Audit_${auditDomain}_${stamp.slice(0, 10)}.txt`, txt, 'text/plain');
}

function download(filename, content, type) {
  const blob = new Blob([content], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

document.getElementById('domainInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') runAudit();
});
</script>
